<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rackschool</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #12386b;
      font-family: "Segoe UI", sans-serif;
    }
    main {
      width: min(88%, 650px);
      padding: 36px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 40px #12386b18;
    }
    p { color: #61718a; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>Rackschool</h1>
    <p>Plataforma escolar carregada pelo servidor central.</p>
    <p>Versão 1.0.0</p>
  </main>
</body>
</html>
